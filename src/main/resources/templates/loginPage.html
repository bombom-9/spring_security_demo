<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="description" content="">
<meta name="author"
	content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
<meta name="generator" content="Jekyll v4.1.1">
<title>Login Page</title>

<!-- Bootstrap core CSS -->
<link href="/public/css/bootstrap.min.css" type="text/css"
	rel="stylesheet">

<!-- Custom styles for this template -->
<link href="/public/css/signin.css" rel="stylesheet">

<style>
.bd-placeholder-img {
	font-size: 1.125rem;
	text-anchor: middle;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;
	user-select: none;
}

@media ( min-width : 768px) {
	.bd-placeholder-img-lg {
		font-size: 3.5rem;
	}
}
</style>

</head>
<body class="text-center">
	<form th:action="@{/login_proc}" class="form-signin" method="post">
	
		<img class="mb-4"
			src="https://getbootstrap.com/docs/4.6/assets/brand/bootstrap-solid.svg"
			alt="" width="72" height="72">
			
		<h1 class="h3 mb-3 font-weight-normal">Please sign in</h1>
		
		<label for="username" class="sr-only">User name</label> 
		<input type="text" name="userId" id="username" class="form-control" placeholder="User name" required autofocus> 
			
		<label for="inputPassword" class="sr-only">Password</label> 
		<input type="password" name="passwd" id="inputPassword" class="form-control" placeholder="Password" required>
			
		<div class="checkbox mb-3">
			<label> 
				<input type="checkbox" value="remember-me"> Remember me
			</label>
		</div>
		
		<button class="btn btn-lg btn-primary btn-block" type="submit">Sign in</button>
		<p class="mt-5 mb-3 text-muted">&copy; 2017-2020</p>
	</form>
</body>
</html>
